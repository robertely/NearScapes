name: Wildlife CPU smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/nearscapes/analyzers/birdnet.py"
      - "pyproject.toml"
      - ".github/workflows/wildlife-smoke.yml"

jobs:
  birdnet-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIRDNET_APP_DATA: ${{ github.workspace }}/.birdnet
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .birdnet
          key: birdnet-v3-onnx-fp16-preview3.1
      - run: uv sync --extra wildlife --extra dev
      - name: Fetch BirdNET reference soundscape
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/birdnet-soundscape.wav \
            https://raw.githubusercontent.com/birdnet-team/birdnet/main/example/soundscape.wav
      - name: Run NearScapes BirdNET analyzer on CPU
        run: |
          cat > /tmp/nearscapes-wildlife-smoke.py <<'PY'
          from pathlib import Path
          import tempfile

          from nearscapes.analyzers.base import AnalyzerContext
          from nearscapes.analyzers.birdnet import BirdNetAnalyzer

          def main():
              audio = Path("/tmp/birdnet-soundscape.wav")
              with tempfile.TemporaryDirectory() as tmp:
                  events = BirdNetAnalyzer().analyze(
                      AnalyzerContext(
                          source_path=audio,
                          cache_dir=Path(tmp),
                          source_sha256="reference",
                      ),
                      {
                          "backend": "onnx",
                          "precision": "fp16",
                          "confidence": 0.10,
                          "n_workers": 1,
                      },
                  )

              print(f"wildlife_events={len(events)}")
              for event in events[:20]:
                  print(
                      f"{event.start_seconds:7.2f}-{event.end_seconds:7.2f} "
                      f"{event.confidence:0.3f} {event.label}"
                  )

              assert events, "BirdNET returned no wildlife detections"
              assert all(event.attributes["device"] == "CPU" for event in events)
              assert any(
                  "Chickadee" in event.label or "Titmouse" in event.label
                  for event in events
              ), "Reference recording did not produce an expected bird-family detection"


          if __name__ == "__main__":
              main()
          PY
          uv run python /tmp/nearscapes-wildlife-smoke.py
      # Export the downloaded model so recordings can be validated outside CI.
      - name: Export BirdNET model cache for local validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdnet-v3-cpu-cache
          path: .birdnet
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

      - name: Switch to Python 3.13 for portable runtime wheels
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download ONNX Runtime wheels
        run: |
          python -m pip download --only-binary=:all:             --dest /tmp/onnxruntime-wheels             onnxruntime==1.23.2
      - name: Export ONNX Runtime wheels
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-py313-linux
          path: /tmp/onnxruntime-wheels
          retention-days: 1
          compression-level: 0

      - name: Fetch North America West BirdNET index
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/north-america-west-indices.txt \
            https://huggingface.co/tphakala/BirdNET-v3.0-Models/resolve/main/regional/north-america-west/birdnet-v3.0-preview3.1-north-america-west-indices-b1.txt
          sha256sum /tmp/north-america-west-indices.txt
      - name: Export North America West filter
        uses: actions/upload-artifact@v4
        with:
          name: birdnet-north-america-west-indices
          path: /tmp/north-america-west-indices.txt
          retention-days: 1
