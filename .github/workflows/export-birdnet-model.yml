name: Export BirdNET model

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-birdnet-model.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIRDNET_APP_DATA: ${{ github.workspace }}/birdnet-models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra wildlife
      - name: Download CPU model
        run: uv run python -c 'import birdnet; birdnet.load("acoustic", "3.0", "onnx", precision="fp16")'
      - uses: actions/upload-artifact@v4
        with:
          name: birdnet-v3-cpu-model
          path: birdnet-models
          retention-days: 1
          compression-level: 0
