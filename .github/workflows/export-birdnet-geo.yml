name: Export BirdNET geo model

on:
  push:
    paths:
      - ".github/workflows/export-birdnet-geo.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BIRDNET_APP_DATA: ${{ github.workspace }}/birdnet-geo-models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra wildlife
      - name: Download CPU geo model
        run: uv run python -c 'import birdnet; birdnet.load("geo", "3.0", "onnx", precision="fp16")'
      - uses: actions/upload-artifact@v4
        with:
          name: birdnet-v3-geo-model
          path: birdnet-geo-models
          retention-days: 1
          compression-level: 0
