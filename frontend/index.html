<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NearScapes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>NearScapes</h1>
        <p>Local audio analysis workbench</p>
      </div>
      <span id="status" class="status">Ready</span>
    </header>

    <section id="drop-zone" class="drop-zone">
      <strong>Drop an audio file here</strong>
      <span id="selected-file">No file selected</span>
      <div class="upload-actions">
        <label class="button-link" for="file-input">Choose file</label>
        <input id="file-input" class="visually-hidden" type="file" accept="audio/*">
        <button id="upload-button" disabled>Upload &amp; Analyze</button>
      </div>
    </section>

    <section id="workspace" class="workspace hidden">
      <div class="source-heading">
        <div>
          <h2 id="filename"></h2>
          <div id="metadata" class="metadata"></div>
        </div>
        <div class="actions"><button id="run-slate" disabled>Rerun 1 kHz slate detector</button><label class="confidence-control" for="birdnet-confidence"><span>Wildlife confidence</span><input id="birdnet-confidence" type="range" min="0.25" max="0.95" step="0.05" value="0.85"><output id="birdnet-confidence-value" for="birdnet-confidence">85%</output></label><button id="run-birdnet" disabled>Rerun BirdNET wildlife</button><a id="analysis-json" class="button-link" href="#" target="_blank">Analysis JSON</a><a id="audacity-project" class="button-link hidden" href="#" download>Download Audacity Project</a></div>
      </div>

      <audio id="audio" controls preload="metadata"></audio>

      <div id="pipeline-stages" class="pipeline-stages hidden" aria-label="Analysis pipeline"></div>

      <section class="recording-summary" aria-label="Recording summary">
        <article class="summary-card">
          <h3>Location</h3>
          <div id="summary-location" class="summary-value">Not found</div>
        </article>
        <article class="summary-card">
          <h3>Top birds</h3>
          <div id="summary-birds" class="summary-list">No wildlife detections yet.</div>
        </article>
        <article class="summary-card summary-notes">
          <h3>Slate &amp; recording notes</h3>
          <div id="summary-notes" class="summary-list">No slate notes found.</div>
        </article>
      </section>

      <div class="timeline-shell">
        <canvas id="waveform"></canvas>
        <div id="lanes" class="lanes"></div>
      </div>

      <div class="runs-heading">
        <h3>Analysis runs</h3>
        <button id="refresh">Refresh</button>
      </div>
      <div id="runs" class="runs"></div>

      <h3>Detected events</h3>
      <div id="events" class="event-list"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
